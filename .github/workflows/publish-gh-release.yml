name: Publish Github release

on:
  schedule:
  - cron: '33 9 * * *' # daily, at 09:33 UTC (17:33 CST)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  publish-release:
    # Run on this repository (raiscui/gh-trends)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install deps
      run: npm ci

    - name: Copy .env file
      run: cp .env.example .env

    - name: Publish Github release
      run: npm run start
      env:
        GITHUB_RELEASES_ENABLED: true
        GITHUB_RELEASES_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    # 发布记忆 feed/published.json 需要随仓库持久化(specs/0001 D3):
    # 下一次运行凭它剔除 昨天和今天已发布项目, 避免 daily 频率下连续霸榜
    - name: Commit published memory
      env:
        # Skip git hooks
        HUSKY: 0
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        # 六榜共享同一份发布记忆.
        git add feed/published.json

        # Nothing to commit? Exit early.
        if git diff --staged --quiet; then
          echo "No changes to commit. Skipping."
          exit 0
        fi

        git commit -m "Update published memory" -m "[skip ci]"

        # 先本地 commit 再 rebase 到远端最新(有 staged 变更时 rebase 会被 git 拒绝,
        # 所以 rebase 必须放在 commit 之后)。
        # -X ours: 冲突取本地 —— 最坏丢对方当天的 published.json 增量,
        # 出现冲突时需要检查记忆是否完整; rebase 仍失败则 abort 并让本步骤标红。
        if ! git pull --rebase -X ours; then
          git rebase --abort
          echo "Rebase failed; published memory will be regenerated next run."
          exit 1
        fi
        git push
