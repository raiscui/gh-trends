name: Publish Github release

on:
  schedule:
  - cron: '33 9 * * *' # daily, at 09:33 UTC (17:33 CST)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  publish-release:
    # Run on this repository (raiscui/gh-trends)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install deps
      run: npm ci

    - name: Copy .env file
      run: cp .env.example .env

    - name: Publish Github release
      run: npm run start
      env:
        GITHUB_RELEASES_ENABLED: true
        GITHUB_RELEASES_REPO: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
