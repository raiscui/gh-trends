name: Update RSS feed

on:
  schedule:
  # Schedules events can be delayed during periods of high loads; prefer uncommon minutes.
  # NOTE: ClickHouse updates Github events every hour at 00:00
  - cron: '27 0 * * *' # daily, at 00:27 UTC (08:27 CST)
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

jobs:
  update-rss:
    # Run on this repository (raiscui/gh-trends)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        # Full history for amend commits
        fetch-depth: 0 # one by default

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install deps
      run: npm ci

    - name: Copy .env file
      run: cp .env.example .env

    - name: Update RSS feed
      run: npm run start
      env:
        RSS_ENABLED: true
        # Actions 默认 GITHUB_TOKEN 无法读取 stargazers(GraphQL 限制),
        # 使用 classic PAT(见仓库 Settings -> Secrets -> GH_PAT)
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    - name: Commit RSS feed updates
      env:
        # Skip git hooks
        HUSKY: 0
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        # feed/published.json 是发布去重记忆(specs/0001 D3), 随 rss 一起持久化
        git add feed/rss.xml feed/published.json

        # Nothing to commit? Exit early.
        if git diff --staged --quiet; then
          echo "No changes to commit. Skipping."
          exit 0
        fi

        last_subject="$(git log -1 --pretty=%s || true)"
        last_author="$(git log -1 --pretty=%an || true)"

        # Safeguard against wiping out git history with force pushes
        commit_count="$(git rev-list --count HEAD)"

        if [ "$last_subject" = "Update RSS feed" ] && [ "$last_author" = "github-actions[bot]" ] && [ "$commit_count" -gt 100 ]; then
          echo "Amending previous commit."
          git commit --amend --no-edit
          # Safer option than -f; won't overwrite if newer commits were added to the remote
          git push --force-with-lease
        else
          echo "Creating a new commit."
          git commit -m "Update RSS feed" -m "[skip ci]"
          # 与 publish-gh-release 同款并发防护(specs/0001 D3):
          # 先 commit 再 rebase 到远端最新; 冲突取本地(最坏丢对方当天 published.json 增量, 无害)
          if ! git pull --rebase -X ours; then
            git rebase --abort
            echo "Rebase failed; feed will be regenerated next run."
            exit 1
          fi
          git push
        fi
